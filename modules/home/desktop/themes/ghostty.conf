# yabai manages normal windows; keep Ghostty tileable.
fullscreen = false
macos-non-native-fullscreen = false
# Reset the command from the previous Nix-generated configuration.
command =
# Restore Ghostty's native close action now that herdr is optional.
keybind = super+w=close_surface

# BEGIN black transparent palette
background = #000000
foreground = #e8e8e8
cursor-color = #ffffff
cursor-text = #000000
selection-background = #333333
selection-foreground = #ffffff
background-image =
background-opacity = 0.4
background-blur = 36
palette = 0=#000000
palette = 1=#c8c8c8
palette = 2=#a8a8a8
palette = 3=#d0d0d0
palette = 4=#d8d8d8
palette = 5=#c0c0c0
palette = 6=#e8e8e8
palette = 7=#f0f0f0
palette = 8=#666666
palette = 9=#d8d8d8
palette = 10=#b8b8b8
palette = 11=#e0e0e0
palette = 12=#ececec
palette = 13=#d4d4d4
palette = 14=#f2f2f2
palette = 15=#ffffff
# END black transparent palette
